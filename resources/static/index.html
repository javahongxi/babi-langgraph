<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babi Agent</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css" id="hljs-light">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css" id="hljs-dark" disabled>
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 30%, #a6c1ee 70%, #fbc2eb 100%); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { background: #1a1a2e; color: #fff; padding: 16px 24px; display: flex; align-items: center; gap: 12px; justify-content: center; }
        header .header-inner { max-width: 1100px; width: 100%; display: flex; align-items: center; gap: 12px; }
        header h1 { font-size: 18px; font-weight: 600; }
        header .badge { background: #00d2ff33; color: #00d2ff; font-size: 12px; padding: 2px 8px; border-radius: 10px; }
        .theme-toggle { background: none; border: 1px solid rgba(255,255,255,0.3); border-radius: 6px; padding: 4px 10px; font-size: 16px; cursor: pointer; color: #fff; }
        .github-link { margin-left: auto; color: #fff; opacity: 0.8; }
        .github-link svg { width: 24px; height: 24px; fill: currentColor; }
        .session-bar { padding: 8px 24px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #666; justify-content: center; }
        .session-bar .session-inner { max-width: 1100px; width: 100%; display: flex; align-items: center; gap: 8px; }
        .session-bar input { border: 1px solid #ddd; border-radius: 4px; padding: 4px 8px; font-size: 13px; width: 160px; outline: none; }
        .session-bar button { background: none; border: 1px solid #ddd; border-radius: 4px; padding: 4px 10px; font-size: 13px; cursor: pointer; color: #666; }
        .main-content { flex: 1; display: flex; overflow: hidden; }
        .sidebar { width: 240px; min-width: 200px; background: #f8f9fa; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; transition: width 0.2s, min-width 0.2s, opacity 0.2s; overflow: hidden; }
        .sidebar.collapsed { width: 0; min-width: 0; opacity: 0; pointer-events: none; }
        .sidebar-header { padding: 10px 14px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: #666; border-bottom: 1px solid #e0e0e0; display: flex; align-items: center; justify-content: space-between; }
        .sidebar-header button { background: none; border: none; cursor: pointer; font-size: 14px; color: #666; padding: 2px 6px; border-radius: 4px; }
        .file-tree { flex: 1; overflow-y: auto; padding: 6px 0; font-size: 13px; }
        .file-tree-item { padding: 4px 14px; cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #333; }
        .file-tree-item:hover { background: rgba(0,0,0,0.05); }
        .file-tree-item.active { background: rgba(26,115,232,0.12); color: #1a73e8; }
        .file-tree-children { padding-left: 16px; }
        .file-tree-toggle { cursor: pointer; user-select: none; width: 16px; text-align: center; flex-shrink: 0; font-size: 10px; color: #888; }
        .content-area { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
        #chat-container { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; }
        #chat-inner { max-width: 1100px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
        .msg { padding: 12px 16px; border-radius: 12px; line-height: 1.7; font-size: 16px; word-break: break-word; }
        .msg.user { max-width: 75%; align-self: flex-end; background: rgba(26,115,232,0.75); backdrop-filter: blur(32px); color: #fff; border-bottom-right-radius: 4px; white-space: pre-wrap; border: 1px solid rgba(255,255,255,0.35); box-shadow: 0 8px 32px rgba(0,0,0,0.12); }
        .msg.agent { width: 100%; background: rgba(255,255,255,0.65); backdrop-filter: blur(32px); color: #333; border-bottom-right-radius: 4px; box-shadow: 0 8px 32px rgba(0,0,0,0.08); border: 1px solid rgba(255,255,255,0.7); }
        .md-content h1, .md-content h2, .md-content h3 { margin: 16px 0 8px; font-weight: 600; }
        .md-content h1 { font-size: 1.5em; border-bottom: 1px solid #eee; padding-bottom: 6px; }
        .md-content h2 { font-size: 1.3em; }
        .md-content p { margin: 8px 0; }
        .md-content ul, .md-content ol { padding-left: 1.8em; margin: 8px 0; }
        .md-content pre { background: #f6f8fa; border-radius: 6px; padding: 12px; overflow-x: auto; margin: 8px 0; font-size: 12px; }
        .md-content code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 0.82em; }
        .md-content :not(pre) > code { background: #f0f0f0; padding: 2px 5px; border-radius: 3px; }
        .md-content table { border-collapse: collapse; margin: 8px 0; width: 100%; }
        .md-content th, .md-content td { border: 1px solid #ddd; padding: 6px 12px; }
        .md-content th { background: #f6f8fa; font-weight: 600; }
        .md-content a { color: #1a73e8; }
        .md-content img { max-width: 100%; border-radius: 4px; }
        .md-content blockquote { border-left: 4px solid #ddd; padding: 4px 12px; margin: 8px 0; color: #666; background: #f9f9f9; border-radius: 0 4px 4px 0; }
        .msg .tool-event { background: #f0f4ff; border-left: 3px solid #1a73e8; padding: 6px 10px; margin: 6px 0; font-size: 13px; color: #555; border-radius: 4px; }
        .msg .tool-event.success { border-left-color: #34a853; }
        #input-area { padding: 16px 24px; display: flex; gap: 12px; align-items: flex-end; justify-content: center; }
        #input-area .input-inner { max-width: 1100px; width: 100%; position: relative; display: flex; align-items: flex-end; }
        #input-area textarea { flex: 1; border: 1px solid rgba(0,0,0,0.1); border-radius: 8px; padding: 12px 80px 12px 14px; font-size: 16px; font-family: inherit; resize: none; outline: none; min-height: 48px; max-height: 120px; line-height: 1.5; background: rgba(255,255,255,0.7); backdrop-filter: blur(8px); }
        #input-area textarea:focus { border-color: #1a73e8; }
        #input-area button { position: absolute; right: 6px; bottom: 6px; background: #1a73e8; color: #fff; border: none; border-radius: 6px; padding: 8px 16px; font-size: 14px; cursor: pointer; height: 36px; }
        #input-area button:disabled { background: #ccc; cursor: not-allowed; }
        .file-preview { width: 0; min-width: 0; background: #fafbfc; border-left: 1px solid #e0e0e0; display: flex; flex-direction: column; overflow: hidden; transition: width 0.2s; }
        .file-preview.open { width: 480px; min-width: 320px; }
        .file-preview-header { padding: 8px 14px; font-size: 12px; font-weight: 600; color: #666; border-bottom: 1px solid #e0e0e0; display: flex; align-items: center; justify-content: space-between; background: #f6f8fa; }
        .file-preview-content { flex: 1; overflow: auto; padding: 0; }
        .file-preview-content pre { margin: 0; padding: 12px 16px; font-size: 12px; line-height: 1.6; white-space: pre; }
        .sidebar-toggle { position: fixed; left: 8px; bottom: 60px; z-index: 100; background: #1a73e8; color: #fff; border: none; border-radius: 50%; width: 36px; height: 36px; font-size: 18px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.2); display: none; }
        .sidebar-toggle.visible { display: flex; align-items: center; justify-content: center; }
        .typing-indicator span { display: inline-block; width: 6px; height: 6px; background: #999; border-radius: 50%; margin: 0 2px; animation: bounce 1.4s infinite both; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        /* Dark mode */
        html[data-theme="dark"] body { background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%); }
        html[data-theme="dark"] header { background: #0d1117; border-bottom: 1px solid #21262d; }
        html[data-theme="dark"] .msg.agent { background: rgba(40,40,50,0.6); color: #e0e0e0; border-color: rgba(255,255,255,0.08); }
        html[data-theme="dark"] .md-content pre { background: #161b22; }
        html[data-theme="dark"] .md-content :not(pre) > code { background: #3a3a3a; }
        html[data-theme="dark"] .md-content th { background: #2a2a2a; }
        html[data-theme="dark"] .md-content a { color: #58a6ff; }
        html[data-theme="dark"] .msg .tool-event { background: rgba(30,42,58,0.8); border-left-color: #58a6ff; color: #aaa; }
        html[data-theme="dark"] #input-area textarea { background: rgba(30,30,30,0.7); border-color: rgba(255,255,255,0.1); color: #e0e0e0; }
        html[data-theme="dark"] #input-area button { background: #1f6feb; }
        html[data-theme="dark"] .sidebar { background: #161b22; border-right-color: #30363d; }
        html[data-theme="dark"] .file-tree-item { color: #c9d1d9; }
        html[data-theme="dark"] .file-preview { background: #0d1117; border-left-color: #30363d; }
        html[data-theme="dark"] .sidebar-toggle { background: #1f6feb; }
    </style>
</head>
<body>
    <header><div class="header-inner">
        <h1>Babi Agent</h1>
        <span class="badge">LangGraph</span>
        <a class="github-link" href="https://github.com/javahongxi/babi" target="_blank" title="GitHub"><svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a>
        <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="切换主题">🌙</button>
    </div></header>
    <div class="session-bar"><div class="session-inner">
        <label>Session:</label>
        <input type="text" id="session-id" value="default" placeholder="session id">
        <button onclick="clearChat()">清空对话</button>
        <button onclick="clearMemory()" title="清除工作区记忆">清除记忆</button>
    </div></div>
    <div class="main-content">
        <div class="sidebar collapsed" id="sidebar">
            <div class="sidebar-header">
                <span>📁 工作区</span>
                <span style="display:flex;gap:4px;">
                    <button onclick="refreshTree()" title="刷新">🔄</button>
                    <button onclick="toggleSidebar()" title="收起">✕</button>
                </span>
            </div>
            <div class="file-tree" id="file-tree"></div>
        </div>
        <div class="content-area">
            <div id="chat-container"><div id="chat-inner"></div></div>
            <div id="input-area"><div class="input-inner">
                <textarea id="user-input" placeholder="输入消息，Enter 发送，Shift+Enter 换行..." rows="1"></textarea>
                <button id="send-btn" onclick="sendMessage()">发送</button>
            </div></div>
        </div>
        <div class="file-preview" id="file-preview">
            <div class="file-preview-header">
                <span class="filename" id="preview-filename"></span>
                <button onclick="closeFilePreview()" title="关闭">✕</button>
            </div>
            <div class="file-preview-content" id="file-preview-content">
                <pre><code id="preview-code"></code></pre>
            </div>
        </div>
    </div>
    <button class="sidebar-toggle visible" id="sidebar-toggle" onclick="toggleSidebar()" title="展开侧边栏">☰</button>

    <script>
        const chatInner = document.getElementById('chat-inner');
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const sessionIdInput = document.getElementById('session-id');
        let isSending = false;

        if (typeof marked !== 'undefined') marked.setOptions({ breaks: true });

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });

        function scrollToBottom() { setTimeout(() => { chatContainer.scrollTop = chatContainer.scrollHeight; }, 20); }

        function renderMarkdown(el, text) {
            if (typeof marked !== 'undefined') {
                el.innerHTML = '<div class="md-content">' + marked.parse(text) + '</div>';
                if (typeof hljs !== 'undefined') {
                    el.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
                }
            } else {
                el.textContent = text;
            }
        }

        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            if (role === 'user') div.textContent = text;
            else renderMarkdown(div, text);
            chatInner.appendChild(div);
            scrollToBottom();
            return div;
        }

        function clearChat() {
            // Clear UI
            chatInner.innerHTML = '';
            // Clear backend session
            const sessionId = sessionIdInput.value.trim() || 'default';
            fetch('/api/chat/session?session_id=' + encodeURIComponent(sessionId), { method: 'DELETE' })
                .then(r => r.json())
                .then(data => console.log('Session cleared:', data.message))
                .catch(err => console.warn('Clear session failed:', err));
        }

        function clearMemory() {
            if (!confirm('确定要清除工作区记忆吗？')) return;
            fetch('/api/chat/memory', { method: 'DELETE' })
                .then(r => r.json())
                .then(data => alert(data.message))
                .catch(err => console.warn('Clear memory failed:', err));
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message || isSending) return;
            isSending = true;
            sendBtn.disabled = true;

            addMessage('user', message);
            userInput.value = '';
            userInput.style.height = 'auto';

            const agentMsg = document.createElement('div');
            agentMsg.className = 'msg agent';
            chatInner.appendChild(agentMsg);

            const indicator = document.createElement('div');
            indicator.className = 'typing-indicator';
            indicator.innerHTML = '<span></span><span></span><span></span>';
            agentMsg.appendChild(indicator);
            scrollToBottom();

            let rawText = '';
            let renderTimer = null;
            const scheduleRender = () => {
                if (renderTimer) return;
                renderTimer = setTimeout(() => {
                    renderTimer = null;
                    renderMarkdown(agentMsg, rawText);
                    scrollToBottom();
                }, 80);
            };

            const sessionId = sessionIdInput.value.trim() || 'default';
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, session_id: sessionId }),
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        const dataStr = line.slice(6).trim();
                        if (!dataStr) continue;
                        try {
                            const data = JSON.parse(dataStr);
                            switch (data.type) {
                                case 'token':
                                    if (indicator.parentNode) indicator.remove();
                                    rawText += data.content;
                                    scheduleRender();
                                    break;
                                case 'tool_call':
                                    if (indicator.parentNode) indicator.remove();
                                    const toolDiv = document.createElement('div');
                                    toolDiv.className = 'tool-event';
                                    toolDiv.textContent = '🔧 调用工具: ' + data.tool;
                                    agentMsg.appendChild(toolDiv);
                                    scrollToBottom();
                                    break;
                                case 'tool_result':
                                    const resultDiv = document.createElement('div');
                                    resultDiv.className = 'tool-event success';
                                    resultDiv.textContent = '✅ ' + data.tool + ' 完成';
                                    agentMsg.appendChild(resultDiv);
                                    scrollToBottom();
                                    break;
                                case 'done':
                                    break;
                                case 'error':
                                    if (indicator.parentNode) indicator.remove();
                                    addMessage('agent', '⚠️ 错误: ' + data.message);
                                    break;
                            }
                        } catch (e) { /* skip parse errors */ }
                    }
                }

                // Final render
                if (renderTimer) { clearTimeout(renderTimer); renderTimer = null; }
                if (rawText) renderMarkdown(agentMsg, rawText);
                else if (indicator.parentNode) indicator.remove();

            } catch (err) {
                if (indicator.parentNode) indicator.remove();
                agentMsg.textContent = '⚠️ 连接失败: ' + err.message;
            }

            scrollToBottom();
            isSending = false;
            sendBtn.disabled = false;
            userInput.focus();
        }

        // Theme
        function applyTheme(theme, save) {
            document.documentElement.setAttribute('data-theme', theme);
            document.getElementById('theme-toggle').textContent = theme === 'dark' ? '☀️' : '🌙';
            document.getElementById('hljs-light').disabled = (theme === 'dark');
            document.getElementById('hljs-dark').disabled = (theme === 'light');
            if (save) localStorage.setItem('babi-theme', theme);
        }
        function toggleTheme() { applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark', true); }
        (function() {
            const saved = localStorage.getItem('babi-theme');
            if (saved) applyTheme(saved);
            else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) applyTheme('dark');
            else applyTheme('light');
        })();

        // File tree
        const fileTreeEl = document.getElementById('file-tree');
        const sidebarEl = document.getElementById('sidebar');
        const sidebarToggleEl = document.getElementById('sidebar-toggle');
        const filePreviewEl = document.getElementById('file-preview');
        const previewFilenameEl = document.getElementById('preview-filename');
        let activeFileItem = null;
        const FILE_ICONS = { py:'🐍', js:'📜', ts:'📘', java:'☕', go:'🔵', html:'🌐', css:'🎨', json:'📋', md:'📝', sh:'🖥️' };
        function getFileIcon(name) { return FILE_ICONS[name.split('.').pop().toLowerCase()] || '📄'; }

        async function loadTree(path, parentEl) {
            try {
                const resp = await fetch('/api/workspace/tree?path=' + encodeURIComponent(path));
                const items = await resp.json();
                items.forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'file-tree-item';
                    row.dataset.path = item.path;
                    if (item.isDir) {
                        const toggle = document.createElement('span'); toggle.className = 'file-tree-toggle'; toggle.textContent = '▶'; row.appendChild(toggle);
                        const icon = document.createElement('span'); icon.className = 'icon'; icon.textContent = '📁'; row.appendChild(icon);
                        const name = document.createElement('span'); name.className = 'name'; name.textContent = item.name; row.appendChild(name);
                        const children = document.createElement('div'); children.className = 'file-tree-children'; children.style.display = 'none';
                        row.addEventListener('click', async (e) => {
                            e.stopPropagation();
                            const isOpen = children.style.display !== 'none';
                            if (isOpen) { children.style.display = 'none'; toggle.textContent = '▶'; icon.textContent = '📁'; }
                            else { if (children.children.length === 0) await loadTree(item.path, children); children.style.display = 'block'; toggle.textContent = '▼'; icon.textContent = '📂'; }
                        });
                        parentEl.appendChild(row); parentEl.appendChild(children);
                    } else {
                        const icon = document.createElement('span'); icon.className = 'icon'; icon.textContent = getFileIcon(item.name); row.appendChild(icon);
                        const name = document.createElement('span'); name.className = 'name'; name.textContent = item.name; row.appendChild(name);
                        row.addEventListener('click', (e) => { e.stopPropagation(); openFilePreview(item.path, item.name); if (activeFileItem) activeFileItem.classList.remove('active'); row.classList.add('active'); activeFileItem = row; });
                        parentEl.appendChild(row);
                    }
                });
            } catch (err) { console.error('Failed to load file tree:', err); }
        }

        async function openFilePreview(path, name) {
            previewFilenameEl.textContent = name;
            filePreviewEl.classList.add('open');
            const contentEl = document.getElementById('file-preview-content');
            try {
                const resp = await fetch('/api/workspace/file?path=' + encodeURIComponent(path));
                const data = await resp.json();
                if (data.error) { contentEl.innerHTML = '<pre>' + data.error + '</pre>'; return; }
                contentEl.innerHTML = '<pre><code></code></pre>';
                const codeEl = contentEl.querySelector('code');
                codeEl.textContent = data.content;
                if (data.language && typeof hljs !== 'undefined') { try { hljs.highlightElement(codeEl); } catch(e) {} }
            } catch (err) { contentEl.innerHTML = '<pre>Failed to load</pre>'; }
        }

        function closeFilePreview() { filePreviewEl.classList.remove('open'); if (activeFileItem) { activeFileItem.classList.remove('active'); activeFileItem = null; } }
        function toggleSidebar() { sidebarEl.classList.toggle('collapsed'); sidebarToggleEl.classList.toggle('visible', sidebarEl.classList.contains('collapsed')); if (sidebarEl.classList.contains('collapsed')) closeFilePreview(); }
        function refreshTree() { fileTreeEl.innerHTML = ''; loadTree('', fileTreeEl); }
        refreshTree();
        userInput.focus();
    </script>
</body>
</html>
